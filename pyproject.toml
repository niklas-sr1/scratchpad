[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scratchpad"
version = "0.1.0"
description = "A single, always-persistent plain-text scratchpad with exact temporal history and lightweight external attachments."
requires-python = ">=3.12"
dependencies = ["PyGObject", "cryptography"]

[project.scripts]
scratchpad = "scratchpad.cli:main"
scratchpad-attach = "scratchpad.cli:attach_main"
scratchpad-insert = "scratchpad.cli:insert_main"

[tool.setuptools.packages.find]
include = ["scratchpad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
